name: Validate and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Node syntax check
        run: node --check analytics.js
      - name: Site validation (canonical, JSON-LD, sitemap, local-only booking, brand promises)
        run: node scripts/validate-site.mjs
      # 防假綠：故意破壞 GA4 ID，確認 validate 真的會擋。
      # 沒有這一步的話，validate 靜默失效（例如比對字串寫錯）會表現為「一直全綠」。
      - name: 防假綠：破壞 GA4 ID 後 validate 必須失敗
        run: |
          cp analytics.js analytics.js.bak
          # 必須改 GA4_ID 常數本身。檔案開頭另有 G-XXXXXXXXXX 佔位字串，
          # 改到那個不會觸發任何斷言，會讓這一步變成假的防假綠。
          node -e "const fs=require('fs');fs.writeFileSync('analytics.js',fs.readFileSync('analytics.js','utf8').replace(/(GA4_ID:\s*['\"])G-[A-Z0-9]+/,'\$1G-BROKEN000'))"
          if node scripts/validate-site.mjs >/dev/null 2>&1; then
            mv analytics.js.bak analytics.js
            echo "::error::validate 未抓到被破壞的 GA4 ID（防假綠失敗）"
            exit 1
          fi
          mv analytics.js.bak analytics.js
          node scripts/validate-site.mjs
      - name: Pages artifact excludes internal docs
        run: bash scripts/prepare-pages-artifact.sh
      - name: 防假綠：案例圖缺檔時 artifact 門禁必須失敗
        run: |
          mv cases/case01-before.jpg cases/case01-before.jpg.gate-test
          if bash scripts/prepare-pages-artifact.sh >/dev/null 2>&1; then
            mv cases/case01-before.jpg.gate-test cases/case01-before.jpg
            echo "::error::artifact 門禁未抓到 cases.json 引用的缺檔案例圖"
            exit 1
          fi
          mv cases/case01-before.jpg.gate-test cases/case01-before.jpg
          bash scripts/prepare-pages-artifact.sh

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare public artifact
        run: bash scripts/prepare-pages-artifact.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
